<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Customer Chat Simulation</title>
<style>
  body { font-family: Arial; padding: 5px; }
  #chat {
    border: 1px solid #ccc;
    padding: 10px;
    width: 600px;
    height: 300px;        /* Fixed height for scrolling */
    overflow-y: auto;     /* Enables scrolling */
    margin-bottom: 10px;
    background-color: #f9f9f9;
  }
  #input { width: 300px; padding: 5px; }
  .ai { color: blue; margin: 5px 0; }
  .user { color: green; margin: 5px 0; }
  .mood { font-size: 1.2em; margin-left: 5px; vertical-align: middle; }
  .chattext { font-size:0.9em; margin: 2px 0; }
  #finishBtn { margin-left: 10px; }
</style>
</head>
<body>

<h2>AI Customer Chat Simulation</h2>
<div id="chat"></div>
<input type="text" id="input" placeholder="Type your message..." />
<button id="sendBtn">Send</button>
<button id="finishBtn">Finish</button>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const finishBtn = document.getElementById("finishBtn");

// Unique session ID
const sessionId = "student_" + Date.now();

// Display message in chat
function addMessage(sender, text, mood = "") {
  const div = document.createElement("div");
  div.className = sender;

  let moodEmoji = "";
  let moodColor = "gray";

  if (mood === "annoyed") { moodEmoji = "😠"; moodColor = "red"; }
  else if (mood === "neutral") { moodEmoji = "😐"; moodColor = "gray"; }
  else if (mood === "calm") { moodEmoji = "🙂"; moodColor = "green"; }

  if (sender === "Alex ") {
    div.innerHTML = `<strong>${sender}:</strong> <p class='chattext'>${text}</p> <span class="mood" style="color:${moodColor}">${moodEmoji}</span>`;
  } else {
    div.innerHTML = `<strong>${sender}:</strong> <p class='chattext'>${text}</p>`;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight; // auto-scroll
}

// Send learner message to server
function sendMessage(message) {
  if (!message) return;
  addMessage("You", message);
  input.value = "";

  fetch("/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ sessionId, message })
  })
  .then(res => res.json())
  .then(data => {
    if (data.reply) {
      addMessage("Alex", data.reply, data.mood || "");
    }
  })
  .catch(err => {
    console.error(err);
    addMessage("Alex", "Error contacting server.");
  });
}

// Send button
sendBtn.addEventListener("click", () => sendMessage(input.value));

// Enter key
input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage(input.value);
});

// Finish conversation and get rating
finishBtn.addEventListener("click", () => {
  fetch("/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      sessionId,
      message: "On a scale of 1-10, how would you rate my service today?"
    })
  })
  .then(res => res.json())
  .then(data => {
    addMessage("Alex", `Rating: ${data.rating}, Comment: ${data.comment}`);
  })
  .catch(err => {
    console.error(err);
    addMessage("Alex", "Error fetching rating.");
  });
});
</script>

</body>
</html>
