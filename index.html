<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chat Simulation</title>
<style>
  body { font-family: Arial; }
  #chat { border: 1px solid #ccc; padding: 10px; width: 300px; height: 400px; overflow-y: auto; }
  #input { width: 240px; }
  .ai { color: blue; }
  .user { color: green; }
</style>
</head>
<body>
<div id="chat"></div>
<input type="text" id="input" placeholder="Type message..." />
<button id="sendBtn">Send</button>
<button id="finishBtn">Finish</button>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const finishBtn = document.getElementById("finishBtn");

const sessionId = "student_" + Date.now();

function addMessage(sender, text) {
  const div = document.createElement("div");
  div.className = sender;
  div.textContent = `${sender}: ${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Send message to server
sendBtn.addEventListener("click", () => {
  const message = input.value;
  if (!message) return;
  addMessage("You", message);
  input.value = "";

  fetch("https://yourserver.com/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ sessionId, message })
  })
  .then(res => res.json())
  .then(data => {
    addMessage("AI", data.reply + " (" + data.mood + ")");
  });
});

// Ask for rating at end
finishBtn.addEventListener("click", () => {
  fetch("https://yourserver.com/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ 
      sessionId, 
      message: "On a scale of 1-10, how would you rate my service today?" 
    })
  })
  .then(res => res.json())
  .then(data => {
    addMessage("AI", `Rating: ${data.rating}, Comment: ${data.comment}`);
  });
});
</script>
</body>
</html>
